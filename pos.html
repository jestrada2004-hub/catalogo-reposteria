<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POS · Utensilios de Repostería</title>

<!-- Configuración PWA para instalar como ícono en celular -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Facturar POS">
<meta name="theme-color" content="#3D2B1F">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233D2B1F'/><text x='50' y='66' font-size='54' text-anchor='middle'>🧁</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233D2B1F'/><text x='50' y='66' font-size='54' text-anchor='middle'>🧁</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<style>
  :root {
    --espresso: #3D2B1F;
    --parchment: #FDFBF7;
    --parchment-dark: #EFE6D8;
    --butter: #C5A059;
    --brick: #9C4A2E;
    --green: #2c7a4b;
    --wa: #25D366;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--parchment);
    color: var(--espresso);
    font-family: 'Inter', sans-serif;
    padding-bottom: 85px;
  }

  header {
    background: var(--espresso);
    color: var(--parchment);
    padding: 1rem 1rem .7rem;
    position: sticky;
    top: 0;
    z-index: 30;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7rem; }
  .top-bar h1 { font-family: 'Fraunces', serif; font-size: 1.25rem; margin: 0; color: var(--butter); }
  .logout-btn { background: rgba(255,255,255,.15); border: none; color: #fff; padding: .35rem .7rem; border-radius: 6px; font-size: .75rem; cursor: pointer; }
  
  .nav-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .nav-btn {
    background: rgba(255,255,255,.1);
    color: var(--parchment);
    border: none;
    padding: .6rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: .88rem;
    cursor: pointer;
  }
  .nav-btn.active { background: var(--butter); color: var(--espresso); }

  .container { max-width: 720px; margin: 0 auto; padding: 1rem; }
  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: #fff;
    border: 1px solid var(--parchment-dark);
    border-radius: 12px;
    padding: .9rem;
    margin-bottom: .9rem;
    box-shadow: 0 2px 6px rgba(61,43,31,.04);
  }
  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem;
    text-transform: uppercase;
    color: var(--brick);
    margin-bottom: .3rem;
  }
  input, select {
    width: 100%;
    padding: .65rem .75rem;
    border: 2px solid var(--parchment-dark);
    border-radius: 8px;
    font-size: .92rem;
    font-family: 'Inter', sans-serif;
    background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: var(--butter); }

  /* Buscador */
  .search-actions { display: flex; gap: .5rem; margin-bottom: .7rem; }
  .btn-manual {
    background: var(--espresso);
    color: var(--butter);
    border: none;
    border-radius: 8px;
    padding: 0 .85rem;
    font-weight: 600;
    font-size: .8rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .prod-list { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: .45rem; }
  .prod-item {
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .5rem;
    border: 1px solid var(--parchment-dark);
    border-radius: 8px;
    background: var(--parchment);
    cursor: pointer;
  }
  .prod-item:active { transform: scale(.99); background: #efe6d8; }
  .prod-item img { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; background: #ddd; flex: none; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-name { font-weight: 600; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prod-meta { font-family: 'IBM Plex Mono', monospace; font-size: .72rem; color: #7a6855; }
  .prod-price { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--espresso); font-size: .9rem; }

  /* Detalle de factura con edición de precio/descuento por ítem */
  .bill-item {
    padding: .65rem 0;
    border-bottom: 1px dashed #d8cbb8;
  }
  .bill-item:last-child { border-bottom: none; }
  .bill-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
  .bill-title { font-weight: 600; font-size: .88rem; }
  .bill-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .5rem;
    margin-top: .45rem;
    flex-wrap: wrap;
  }
  .price-edit-box { display: flex; align-items: center; gap: .35rem; font-family: 'IBM Plex Mono', monospace; font-size: .75rem; }
  .price-edit-box input { width: 82px; padding: .3rem .45rem; font-size: .82rem; font-family: 'IBM Plex Mono', monospace; text-align: right; }
  .disc-badge { background: #dff0e4; color: var(--green); font-size: .68rem; padding: .15rem .4rem; border-radius: 4px; font-weight: 600; }
  .qty-ctrl { display: flex; align-items: center; gap: .35rem; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--espresso);
    background: #fff; font-weight: 700; font-size: .95rem; cursor: pointer;
  }
  .qty-val { font-family: 'IBM Plex Mono', monospace; min-width: 20px; text-align: center; font-weight: 600; font-size: .88rem; }

  /* Totales y Botones de acción */
  .totals-row { display: flex; justify-content: space-between; margin: .35rem 0; font-family: 'IBM Plex Mono', monospace; font-size: .86rem; }
  .totals-row.grand { font-size: 1.15rem; font-weight: 700; color: var(--espresso); border-top: 2px solid var(--espresso); padding-top: .5rem; margin-top: .5rem; }
  .action-buttons { display: grid; grid-template-columns: 1fr 2fr; gap: .6rem; margin-top: .9rem; }
  .btn-preview {
    padding: .9rem .6rem;
    background: var(--butter);
    color: var(--espresso);
    border: none;
    border-radius: 10px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-cobrar {
    padding: .9rem;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-cobrar:disabled, .btn-preview:disabled { opacity: .45; cursor: not-allowed; }

  /* Modales */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
    z-index: 100; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: var(--parchment); width: 100%; max-width: 440px; max-height: 90vh;
    overflow-y: auto; border-radius: 12px; padding: 1.2rem;
  }
  .modal-content h3 { margin-top: 0; font-family: 'Fraunces', serif; }

  /* Ticket Vista Previa */
  .ticket-paper {
    background: #fff;
    border: 1px dashed #999;
    padding: 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .78rem;
    color: #222;
    border-radius: 6px;
  }
  .ticket-center { text-align: center; }
  .ticket-line { border-top: 1px dashed #bbb; margin: .6rem 0; }
  .ticket-row { display: flex; justify-content: space-between; margin: .25rem 0; gap: .5rem; }

  /* Reportes & Edición de facturas */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: 1rem; }
  .kpi { background: #fff; border: 1px solid var(--parchment-dark); border-radius: 10px; padding: .8rem; }
  .kpi .num { font-family: 'Fraunces', serif; font-size: 1.35rem; font-weight: 700; color: var(--espresso); }
  .kpi .lbl { font-family: 'IBM Plex Mono', monospace; font-size: .68rem; color: var(--brick); text-transform: uppercase; }
  .sale-card { background: #fff; border: 1px solid var(--parchment-dark); border-radius: 10px; padding: .85rem; margin-bottom: .7rem; }
  .sale-card.anulada { opacity: .65; background: #faf3f2; border-color: #e4b9b4; }
  .sale-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: .92rem; }
  .badge-anulada { background: var(--brick); color: #fff; font-size: .65rem; padding: .15rem .45rem; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
  .sale-meta { font-family: 'IBM Plex Mono', monospace; font-size: .72rem; color: #7a6855; margin: .25rem 0 .5rem; }
  .sale-items { font-size: .8rem; color: #4a3527; border-top: 1px dashed #e0d5c5; padding-top: .45rem; }
  .sale-actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .65rem; padding-top: .55rem; border-top: 1px solid #f0e8dc; }
  .btn-sm {
    border: none; border-radius: 6px; padding: .4rem .65rem; font-size: .74rem;
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: .25rem;
  }
  .btn-edit { background: var(--butter); color: var(--espresso); }
  .btn-void { background: var(--brick); color: #fff; }
  .btn-pdf { background: var(--espresso); color: var(--parchment); }
  .btn-wa { background: var(--wa); color: #fff; }

  .edit-det-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: .45rem; background: #fff; border: 1px solid var(--parchment-dark);
    border-radius: 6px; margin-bottom: .4rem; font-size: .82rem;
  }
</style>
</head>
<body>

<header>
  <div class="top-bar">
    <h1>🧾 Facturación POS</h1>
    <button class="logout-btn" id="btn-logout">Salir</button>
  </div>
  <div class="nav-tabs">
    <button class="nav-btn active" data-view="pos">Nueva Venta</button>
    <button class="nav-btn" data-view="report">Reporte de Ventas</button>
  </div>
</header>

<!-- VISTA 1: PUNTO DE VENTA -->
<div class="container view active" id="view-pos">
  
  <!-- Datos del Cliente -->
  <div class="card">
    <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:.6rem; margin-bottom:.6rem;">
      <div>
        <label for="cliente-nombre">Cliente</label>
        <input type="text" id="cliente-nombre" value="Consumidor Final" onfocus="if(this.value==='Consumidor Final')this.select()">
      </div>
      <div>
        <label for="cliente-telefono">Celular (WhatsApp)</label>
        <input type="tel" id="cliente-telefono" placeholder="Ej. 99887766">
      </div>
    </div>
    <div>
      <label for="metodo-pago">Método de Pago</label>
      <select id="metodo-pago">
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia</option>
        <option value="Tarjeta">Tarjeta</option>
      </select>
    </div>
  </div>

  <!-- Buscador y Producto Manual -->
  <div class="card">
    <label>Buscar producto en inventario</label>
    <div class="search-actions">
      <input type="search" id="search-input" placeholder="Buscar por nombre...">
      <button type="button" class="btn-manual" id="btn-open-manual">+ No en sistema</button>
    </div>
    <div class="prod-list" id="prod-list">Cargando productos...</div>
  </div>

  <!-- Cuenta / Factura Actual -->
  <div class="card">
    <label>Detalle de la factura (<span id="bill-count">0</span> artículos)</label>
    <div id="bill-list"><p style="font-size:.85rem;color:#8a7960;text-align:center;">Toca un producto arriba para agregarlo.</p></div>

    <div style="margin-top:.8rem; border-top: 1px solid var(--parchment-dark); padding-top:.6rem;">
      <div class="totals-row"><span>Subtotal</span><span id="lbl-subtotal">L. 0.00</span></div>
      <div class="totals-row" style="align-items:center;">
        <span>Descuento adicional al total (L.)</span>
        <input type="number" id="input-descuento" value="0" min="0" step="1" style="width:95px;padding:.35rem .5rem;text-align:right;font-family:'IBM Plex Mono',monospace;">
      </div>
      <div class="totals-row grand"><span>TOTAL A COBRAR</span><span id="lbl-total">L. 0.00</span></div>
    </div>

    <div class="action-buttons">
      <button type="button" class="btn-preview" id="btn-preview" disabled>👁️ Vista Previa</button>
      <button type="button" class="btn-cobrar" id="btn-facturar" disabled>✅ Facturar</button>
    </div>
  </div>
</div>

<!-- VISTA 2: REPORTE DE VENTAS -->
<div class="container view" id="view-report">
  <div class="card" style="display:flex; gap:.5rem; align-items:flex-end;">
    <div style="flex:1;">
      <label for="filtro-fecha">Filtrar por fecha</label>
      <input type="date" id="filtro-fecha">
    </div>
    <button type="button" id="btn-ver-todas" style="padding:.68rem .9rem; border-radius:8px; border:none; background:var(--parchment-dark); font-weight:600; cursor:pointer;">Ver todas</button>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="num" id="kpi-total">L. 0.00</div><div class="lbl">Vendido (Activas)</div></div>
    <div class="kpi"><div class="num" id="kpi-count">0</div><div class="lbl">Facturas Activas</div></div>
  </div>

  <div id="sales-report-list">Cargando reporte...</div>
</div>

<!-- MODAL: VISTA PREVIA DE FACTURA -->
<div class="modal" id="modal-preview">
  <div class="modal-content">
    <h3>Vista Previa de Factura</h3>
    <div class="ticket-paper" id="preview-ticket-body"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:.5rem; margin-top:1rem;">
      <button type="button" id="btn-close-preview" style="padding:.75rem; background:var(--parchment-dark); border:none; border-radius:8px; font-weight:600;">Seguir editando</button>
      <button type="button" id="btn-confirm-from-preview" style="padding:.75rem; background:var(--green); color:#fff; border:none; border-radius:8px; font-weight:700;">✅ Confirmar y Facturar</button>
    </div>
  </div>
</div>

<!-- MODAL: PRODUCTO NO EN SISTEMA -->
<div class="modal" id="modal-manual">
  <div class="modal-content">
    <h3>Producto no en sistema</h3>
    <div style="margin-bottom:.7rem;">
      <label>Descripción del producto</label>
