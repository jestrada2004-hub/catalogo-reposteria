<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POS · Utensilios de Repostería</title>

<!-- Configuración para instalar como App (Ícono en celular) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Facturar POS">
<meta name="theme-color" content="#3D2B1F">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233D2B1F'/><text x='50' y='66' font-size='54' text-anchor='middle'>🧁</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233D2B1F'/><text x='50' y='66' font-size='54' text-anchor='middle'>🧁</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<style>
  :root {
    --espresso: #3D2B1F;
    --parchment: #FDFBF7;
    --parchment-dark: #EFE6D8;
    --butter: #C5A059;
    --brick: #9C4A2E;
    --green: #2c7a4b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--parchment);
    color: var(--espresso);
    font-family: 'Inter', sans-serif;
    padding-bottom: 85px;
  }

  /* Header & Tabs */
  header {
    background: var(--espresso);
    color: var(--parchment);
    padding: 1rem 1rem .7rem;
    position: sticky;
    top: 0;
    z-index: 30;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7rem; }
  .top-bar h1 { font-family: 'Fraunces', serif; font-size: 1.25rem; margin: 0; color: var(--butter); }
  .logout-btn { background: rgba(255,255,255,.15); border: none; color: #fff; padding: .35rem .7rem; border-radius: 6px; font-size: .75rem; cursor: pointer; }
  
  .nav-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .nav-btn {
    background: rgba(255,255,255,.1);
    color: var(--parchment);
    border: none;
    padding: .6rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: .88rem;
    cursor: pointer;
  }
  .nav-btn.active { background: var(--butter); color: var(--espresso); }

  .container { max-width: 720px; margin: 0 auto; padding: 1rem; }
  .view { display: none; }
  .view.active { display: block; }

  /* Inputs & Cards */
  .card {
    background: #fff;
    border: 1px solid var(--parchment-dark);
    border-radius: 12px;
    padding: .9rem;
    margin-bottom: .9rem;
    box-shadow: 0 2px 6px rgba(61,43,31,.04);
  }
  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .7rem;
    text-transform: uppercase;
    color: var(--brick);
    margin-bottom: .3rem;
  }
  input, select {
    width: 100%;
    padding: .7rem .8rem;
    border: 2px solid var(--parchment-dark);
    border-radius: 8px;
    font-size: .95rem;
    font-family: 'Inter', sans-serif;
    background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: var(--butter); }

  /* Buscador y Lista de Productos */
  .search-actions { display: flex; gap: .5rem; margin-bottom: .7rem; }
  .btn-manual {
    background: var(--espresso);
    color: var(--butter);
    border: none;
    border-radius: 8px;
    padding: 0 .9rem;
    font-weight: 600;
    font-size: .8rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .prod-list { max-height: 270px; overflow-y: auto; display: flex; flex-direction: column; gap: .45rem; }
  .prod-item {
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .55rem;
    border: 1px solid var(--parchment-dark);
    border-radius: 8px;
    background: var(--parchment);
    cursor: pointer;
  }
  .prod-item:active { transform: scale(.99); background: #efe6d8; }
  .prod-item img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #ddd; flex: none; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-name { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prod-meta { font-family: 'IBM Plex Mono', monospace; font-size: .72rem; color: #7a6855; }
  .prod-price { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--espresso); font-size: .9rem; }

  /* Carrito / Cuenta Actual */
  .bill-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .5rem;
    padding: .6rem 0;
    border-bottom: 1px dashed #d8cbb8;
  }
  .bill-item:last-child { border-bottom: none; }
  .bill-desc { flex: 1; min-width: 0; }
  .bill-title { font-weight: 600; font-size: .88rem; }
  .bill-sub { font-family: 'IBM Plex Mono', monospace; font-size: .75rem; color: #7a6855; }
  .qty-ctrl { display: flex; align-items: center; gap: .35rem; }
  .qty-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--espresso);
    background: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  .qty-val { font-family: 'IBM Plex Mono', monospace; min-width: 22px; text-align: center; font-weight: 600; }

  /* Totales y Botón Cobrar */
  .totals-row { display: flex; justify-content: space-between; margin: .35rem 0; font-family: 'IBM Plex Mono', monospace; font-size: .88rem; }
  .totals-row.grand { font-size: 1.15rem; font-weight: 700; color: var(--espresso); border-top: 2px solid var(--espresso); padding-top: .5rem; margin-top: .5rem; }
  .btn-cobrar {
    width: 100%;
    padding: .95rem;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 700;
    margin-top: .8rem;
    cursor: pointer;
  }
  .btn-cobrar:disabled { opacity: .5; cursor: not-allowed; }

  /* Modal Producto Manual & Login */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 100; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal.open { display: flex; }
  .modal-content { background: var(--parchment); width: 100%; max-width: 400px; border-radius: 12px; padding: 1.2rem; }
  .modal-content h3 { margin-top: 0; font-family: 'Fraunces', serif; }

  /* Reportes */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: 1rem; }
  .kpi { background: #fff; border: 1px solid var(--parchment-dark); border-radius: 10px; padding: .8rem; }
  .kpi .num { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 700; color: var(--espresso); }
  .kpi .lbl { font-family: 'IBM Plex Mono', monospace; font-size: .68rem; color: var(--brick); text-transform: uppercase; }
  .sale-card { background: #fff; border: 1px solid var(--parchment-dark); border-radius: 10px; padding: .8rem; margin-bottom: .6rem; }
  .sale-head { display: flex; justify-content: space-between; font-weight: 700; font-size: .9rem; }
  .sale-meta { font-family: 'IBM Plex Mono', monospace; font-size: .72rem; color: #7a6855; margin: .2rem 0 .4rem; }
  .sale-items { font-size: .8rem; color: #4a3527; border-top: 1px dashed #e0d5c5; padding-top: .4rem; }
</style>
</head>
<body>

<header>
  <div class="top-bar">
    <h1>🧾 Facturación POS</h1>
    <button class="logout-btn" id="btn-logout">Salir</button>
  </div>
  <div class="nav-tabs">
    <button class="nav-btn active" data-view="pos">Nueva Venta</button>
    <button class="nav-btn" data-view="report">Reporte de Ventas</button>
  </div>
</header>

<!-- VISTA 1: PUNTO DE VENTA / FACTURACIÓN -->
<div class="container view active" id="view-pos">
  
  <!-- Cliente -->
  <div class="card">
    <div style="display:grid; grid-template-columns: 2fr 1fr; gap:.6rem;">
      <div>
        <label for="cliente-nombre">Cliente</label>
        <input type="text" id="cliente-nombre" value="Consumidor Final" onfocus="if(this.value==='Consumidor Final')this.select()">
      </div>
      <div>
        <label for="metodo-pago">Pago</label>
        <select id="metodo-pago">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Tarjeta">Tarjeta</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Buscador y Producto Manual -->
  <div class="card">
    <label>Buscar producto en inventario</label>
    <div class="search-actions">
      <input type="search" id="search-input" placeholder="Escribe nombre o categoría...">
      <button type="button" class="btn-manual" id="btn-open-manual">+ No en sistema</button>
    </div>
    <div class="prod-list" id="prod-list">Cargando productos...</div>
  </div>

  <!-- Cuenta / Factura Actual -->
  <div class="card">
    <label>Detalle de la factura (<span id="bill-count">0</span> artículos)</label>
    <div id="bill-list"><p style="font-size:.85rem;color:#8a7960;text-align:center;">Toca un producto arriba para agregarlo a la cuenta.</p></div>

    <div style="margin-top:.8rem;">
      <div class="totals-row"><span>Subtotal</span><span id="lbl-subtotal">L. 0.00</span></div>
      <div class="totals-row" style="align-items:center;">
        <span>Descuento (L.)</span>
        <input type="number" id="input-descuento" value="0" min="0" step="1" style="width:95px;padding:.3rem .5rem;text-align:right;">
      </div>
      <div class="totals-row grand"><span>TOTAL A COBRAR</span><span id="lbl-total">L. 0.00</span></div>
    </div>

    <button class="btn-cobrar" id="btn-facturar" disabled>✅ Facturar y Descontar Inventario</button>
  </div>
</div>

<!-- VISTA 2: REPORTE DE VENTAS -->
<div class="container view" id="view-report">
  <div class="card" style="display:flex; gap:.5rem; align-items:flex-end;">
    <div style="flex:1;">
      <label for="filtro-fecha">Filtrar por fecha</label>
      <input type="date" id="filtro-fecha">
    </div>
    <button type="button" id="btn-ver-todas" style="padding:.7rem .9rem; border-radius:8px; border:none; background:var(--parchment-dark); font-weight:600; cursor:pointer;">Ver todas</button>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="num" id="kpi-total">L. 0.00</div><div class="lbl">Total Vendido</div></div>
    <div class="kpi"><div class="num" id="kpi-count">0</div><div class="lbl">Facturas Emitidas</div></div>
  </div>

  <div id="sales-report-list">Cargando reporte...</div>
</div>

<!-- MODAL: PRODUCTO NO EN SISTEMA -->
<div class="modal" id="modal-manual">
  <div class="modal-content">
    <h3>Producto no en sistema</h3>
    <div style="margin-bottom:.7rem;">
      <label>Descripción del producto</label>
      <input type="text" id="manual-desc" placeholder="Ej. Caja especial o envío">
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom:1rem;">
      <div>
        <label>Precio Unitario (L.)</label>
        <input type="number" id="manual-price" step="0.01" min="0" placeholder="0.00">
      </div>
      <div>
        <label>Cantidad</label>
        <input type="number" id="manual-qty" value="1" min="1" step="1">
      </div>
    </div>
    <div style="display:flex; gap:.5rem;">
      <button type="button" id="btn-save-manual" style="flex:1; padding:.75rem; background:var(--espresso); color:var(--butter); border:none; border-radius:8px; font-weight:700;">Agregar a factura</button>
      <button type="button" id="btn-close-manual" style="padding:.75rem 1rem; background:var(--parchment-dark); border:none; border-radius:8px;">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL: LOGIN ADMIN -->
<div class="modal" id="modal-login">
  <div class="modal-content">
    <h3>Iniciar Sesión POS</h3>
    <form id="login-form">
      <div style="margin-bottom:.7rem;">
        <label>Correo</label>
        <input type="email" id="login-email" required>
      </div>
      <div style="margin-bottom:1rem;">
        <label>Contraseña</label>
        <input type="password" id="login-pass" required>
      </div>
      <button type="submit" style="width:100%; padding:.8rem; background:var(--espresso); color:var(--butter); border:none; border-radius:8px; font-weight:700;">Entrar</button>
      <p id="login-err" style="color:var(--brick); font-size:.8rem; margin-top:.5rem;"></p>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://cceyeoextdoqhqacnban.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_mAlRUydh4f-tJIF--U-Hrg_YAo-8kD1';
const BUSINESS_NAME = 'Utensilios de Repostería y Más';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let catalogItems = []; // Lista unificada de productos y variantes con stock
let bill = [];         // Líneas de la factura actual

const money = n => `L. ${Number(n || 0).toLocaleString('es-HN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

// --- AUTENTICACIÓN ---
async function initAuth() {
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    document.getElementById('modal-login').classList.add('open');
  } else {
    loadInventory();
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('login-err').textContent = 'Credenciales incorrectas.';
    return;
  }
  document.getElementById('modal-login').classList.remove('open');
  loadInventory();
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

// --- NAVEGACIÓN ENTRE PESTAÑAS ---
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'report') loadSalesReport();
  });
});

// --- CARGAR INVENTARIO (PRODUCTOS + COLORES) ---
async function loadInventory() {
  const [{ data: products }, { data: variants }] = await Promise.all([
    sb.from('products').select('*').order('name'),
    sb.from('product_variants').select('*').order('color_name')
  ]);

  const varsByProd = {};
  (variants || []).forEach(v => {
    if (!varsByProd[v.product_id]) varsByProd[v.product_id] = [];
    varsByProd[v.product_id].push(v);
  });

  catalogItems = [];
  (products || []).forEach(p => {
    const basePrice = (p.offer_enabled && p.offer_price) ? Number(p.offer_price) : Number(p.price || 0);
    const pVars = varsByProd[p.id] || [];
    if (pVars.length > 0) {
      pVars.forEach(v => {
        catalogItems.push({
          key: `p${p.id}-v${v.id}`,
          producto_id: p.id,
          variant_id: v.id,
          descripcion: `${p.name} (${v.color_name})`,
          precio: basePrice,
          stock: Number(v.stock || 0),
          img: v.image_url || p.image_url || ''
        });
      });
    } else {
      catalogItems.push({
        key: `p${p.id}`,
        producto_id: p.id,
        variant_id: null,
        descripcion: p.name,
        precio: basePrice,
        stock: Number(p.stock || 0),
        img: p.image_url || ''
      });
    }
  });
  renderProductList();
}

function renderProductList() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const listEl = document.getElementById('prod-list');
  const filtered = catalogItems.filter(i => !q || i.descripcion.toLowerCase().includes(q));

  if (!filtered.length) {
    listEl.innerHTML = '<p style="font-size:.85rem;color:#8a7960;text-align:center;">No encontrado. Usa "+ No en sistema".</p>';
    return;
  }

  listEl.innerHTML = '';
  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'prod-item';
    div.innerHTML = `
      <img src="${item.img || 'https://placehold.co/80x80/EFE6D8/3D2B1F?text=•'}" alt="">
      <div class="prod-info">
        <div class="prod-name">${item.descripcion}</div>
        <div class="prod-meta">Stock: <strong style="color:${item.stock > 0 ? '#2c7a4b' : '#9C4A2E'}">${item.stock}</strong></div>
      </div>
      <div class="prod-price">${money(item.precio)}</div>
    `;
    div.onclick = () => addProductToBill(item);
    listEl.appendChild(div);
  });
}
document.getElementById('search-input').addEventListener('input', renderProductList);

// --- AGREGAR A FACTURA ---
function addProductToBill(item) {
  if (item.stock <= 0) {
    if (!confirm(`"${item.descripcion}" tiene 0 en stock. ¿Deseas agregarlo de todas formas?`)) return;
  }
  const existing = bill.find(b => b.key === item.key);
  if (existing) {
    existing.cantidad++;
  } else {
    bill.push({
      key: item.key,
      producto_id: item.producto_id,
      variant_id: item.variant_id,
      descripcion: item.descripcion,
      precio_unitario: item.precio,
      cantidad: 1,
      es_manual: false
    });
  }
  renderBill();
}

// --- PRODUCTO NO EN SISTEMA (MANUAL) ---
const modalManual = document.getElementById('modal-manual');
document.getElementById('btn-open-manual').onclick = () => {
  document.getElementById('manual-desc').value = '';
  document.getElementById('manual-price').value = '';
  document.getElementById('manual-qty').value = '1';
  modalManual.classList.add('open');
  document.getElementById('manual-desc').focus();
};
document.getElementById('btn-close-manual').onclick = () => modalManual.classList.remove('open');

document.getElementById('btn-save-manual').onclick = () => {
  const desc = document.getElementById('manual-desc').value.trim();
  const price = parseFloat(document.getElementById('manual-price').value);
  const qty = parseInt(document.getElementById('manual-qty').value) || 1;
  if (!desc || isNaN(price) || price < 0) return alert('Ingresa una descripción y un precio válido.');

  bill.push({
    key: 'manual-' + Date.now(),
    producto_id: null,
    variant_id: null,
    descripcion: desc + ' [Manual]',
    precio_unitario: price,
    cantidad: qty,
    es_manual: true
  });
  modalManual.classList.remove('open');
  renderBill();
};

// --- RENDERIZAR FACTURA ACTUAL ---
function renderBill() {
  const listEl = document.getElementById('bill-list');
  document.getElementById('bill-count').textContent = bill.reduce((s, i) => s + i.cantidad, 0);

  if (!bill.length) {
    listEl.innerHTML = '<p style="font-size:.85rem;color:#8a7960;text-align:center;">Toca un producto arriba para agregarlo a la cuenta.</p>';
    document.getElementById('btn-facturar').disabled = true;
    updateTotals();
    return;
  }

  listEl.innerHTML = '';
  bill.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'bill-item';
    row.innerHTML = `
      <div class="bill-desc">
        <div class="bill-title">${item.descripcion}</div>
        <div class="bill-sub">${money(item.precio_unitario)} c/u · Sub: ${money(item.precio_unitario * item.cantidad)}</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" data-d="-1">−</button>
        <span class="qty-val">${item.cantidad}</span>
        <button class="qty-btn" data-d="1">+</button>
      </div>
    `;
    row.querySelector('[data-d="-1"]').onclick = () => {
      item.cantidad--;
      if (item.cantidad <= 0) bill.splice(idx, 1);
      renderBill();
    };
    row.querySelector('[data-d="1"]').onclick = () => {
      item.cantidad++;
      renderBill();
    };
    listEl.appendChild(row);
  });

  document.getElementById('btn-facturar').disabled = false;
  updateTotals();
}

function updateTotals() {
  const sub = bill.reduce((s, i) => s + (i.precio_unitario * i.cantidad), 0);
  const desc = Math.max(0, parseFloat(document.getElementById('input-descuento').value) || 0);
  const total = Math.max(0, sub - desc);
  document.getElementById('lbl-subtotal').textContent = money(sub);
  document.getElementById('lbl-total').textContent = money(total);
  return { sub, desc, total };
}
document.getElementById('input-descuento').addEventListener('input', updateTotals);

// --- PROCESAR VENTA Y DESCONTAR INVENTARIO ---
document.getElementById('btn-facturar').addEventListener('click', async () => {
  if (!bill.length) return;
  const btn = document.getElementById('btn-facturar');
  btn.disabled = true;
  btn.textContent = 'Procesando venta...';

  const cliente = document.getElementById('cliente-nombre').value.trim() || 'Consumidor Final';
  const metodo = document.getElementById('metodo-pago').value;
  const { sub, desc, total } = updateTotals();

  const { data, error } = await sb.rpc('registrar_venta_pos', {
    p_cliente_nombre: cliente,
    p_metodo_pago: metodo,
    p_descuento: desc,
    p_notas: null,
    p_items: bill
  });

  if (error) {
    alert('Error al registrar venta: ' + error.message);
    btn.disabled = false;
    btn.textContent = '✅ Facturar y Descontar Inventario';
    return;
  }

  // Generar comprobante PDF
  generarReciboPDF(data.id, cliente, metodo, bill, sub, desc, total);

  // Reiniciar pantalla
  bill = [];
  document.getElementById('cliente-nombre').value = 'Consumidor Final';
  document.getElementById('input-descuento').value = '0';
  renderBill();
  await loadInventory();
  btn.textContent = '✅ Facturar y Descontar Inventario';
  alert(`¡Venta #${data.id} registrada con éxito! Inventario actualizado.`);
});

function generarReciboPDF(ventaId, cliente, metodo, items, sub, desc, total) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ format: [80, 180], unit: 'mm' }); // Formato ticket térmico 80mm
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text(BUSINESS_NAME, 40, 10, { align: 'center' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.text(`Comprobante #${ventaId}`, 40, 15, { align: 'center' });
  doc.text(new Date().toLocaleString('es-HN'), 40, 19, { align: 'center' });
  doc.text(`Cliente: ${cliente}`, 5, 26);
  doc.text(`Pago: ${metodo}`, 5, 30);

  doc.autoTable({
    startY: 34,
    margin: { left: 4, right: 4 },
    styles: { fontSize: 7, cellPadding: 1 },
    head: [['Cant', 'Producto', 'Total']],
    body: items.map(i => [i.cantidad, i.descripcion, money(i.cantidad * i.precio_unitario)]),
    theme: 'plain'
  });

  let y = doc.lastAutoTable.finalY + 5;
  doc.text(`Subtotal: ${money(sub)}`, 75, y, { align: 'right' });
  if (desc > 0) { y += 4; doc.text(`Descuento: -${money(desc)}`, 75, y, { align: 'right' }); }
  y += 5;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.text(`TOTAL: ${money(total)}`, 75, y, { align: 'right' });
  doc.save(`venta-${ventaId}.pdf`);
}

// --- REPORTE DE VENTAS ---
async function loadSalesReport() {
  const listEl = document.getElementById('sales-report-list');
  listEl.innerHTML = 'Cargando ventas...';

  const fechaFiltro = document.getElementById('filtro-fecha').value;
  let query = sb.from('ventas').select('*, detalle_ventas(*)').order('fecha', { ascending: false });

  if (fechaFiltro) {
    query = query.gte('fecha', `${fechaFiltro}T00:00:00`).lte('fecha', `${fechaFiltro}T23:59:59`);
  }

  const { data, error } = await query;
  if (error) {
    listEl.innerHTML = `<p style="color:var(--brick);">Error: ${error.message}</p>`;
    return;
  }

  const ventas = data || [];
  const totalVendido = ventas.reduce((s, v) => s + Number(v.total || 0), 0);
  document.getElementById('kpi-total').textContent = money(totalVendido);
  document.getElementById('kpi-count').textContent = ventas.length;

  if (!ventas.length) {
    listEl.innerHTML = '<p style="text-align:center;color:#8a7960;">No hay ventas registradas en este periodo.</p>';
    return;
  }

  listEl.innerHTML = '';
  ventas.forEach(v => {
    const itemsTxt = (v.detalle_ventas || [])
      .map(d => `${d.cantidad}x ${d.descripcion} (${money(d.subtotal)})`)
      .join(' · ');
    const card = document.createElement('div');
    card.className = 'sale-card';
    card.innerHTML = `
      <div class="sale-head">
        <span>#${v.id} · ${v.cliente_nombre}</span>
        <span style="color:#2c7a4b;">${money(v.total)}</span>
      </div>
      <div class="sale-meta">${new Date(v.fecha).toLocaleString('es-HN')} · ${v.metodo_pago}</div>
      <div class="sale-items">${itemsTxt}</div>
    `;
    listEl.appendChild(card);
  });
}

document.getElementById('filtro-fecha').addEventListener('change', loadSalesReport);
document.getElementById('btn-ver-todas').addEventListener('click', () => {
  document.getElementById('filtro-fecha').value = '';
  loadSalesReport();
});

initAuth();
</script>
