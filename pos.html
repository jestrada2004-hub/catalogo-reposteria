<style>
  :root {
    --espresso: #3D2B1F;
    --parchment: #FDFBF7;
    --parchment-dark: #EFE6D8;
    --butter: #C5A059;
    --brick: #9C4A2E;
    --green: #2c7a4b;
    --wa: #25D366;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--parchment);
    color: var(--espresso);
    font-family: 'Inter', sans-serif;
    padding-bottom: 85px;
  }

  header {
    background: var(--espresso);
    color: var(--parchment);
    padding: 1rem 1rem .7rem;
    position: sticky;
    top: 0;
    z-index: 30;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7rem; }
  .top-bar h1 { font-family: 'Fraunces', serif; font-size: 1.25rem; margin: 0; color: var(--butter); }
  .header-actions { display: flex; gap: .4rem; align-items: center; }
  .icon-top-btn {
    background: rgba(255,255,255,.15); border: none; color: #fff;
    padding: .35rem .65rem; border-radius: 6px; font-size: .75rem; cursor: pointer;
  }

  .nav-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .nav-btn {
    background: rgba(255,255,255,.1);
    color: var(--parchment);
    border: none;
    padding: .6rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: .88rem;
    cursor: pointer;
  }
  .nav-btn.active { background: var(--butter); color: var(--espresso); }

  .container { max-width: 720px; margin: 0 auto; padding: 1rem; }
  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: #fff;
    border: 1px solid var(--parchment-dark);
    border-radius: 12px;
    padding: .9rem;
    margin-bottom: .9rem;
    box-shadow: 0 2px 6px rgba(61,43,31,.04);
  }
  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size
